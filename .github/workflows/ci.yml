name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestor-tests:
    name: Attestor tests (H-2 salted hash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node --experimental-strip-types (>= 22.6)
      - name: Install deps
        working-directory: attestor
        run: npm ci
      - name: Run tests
        working-directory: attestor
        run: npm test

  attestor-endpoint-tests:
    name: Attestor endpoint tests (DID, device, inspect proxy, batcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install attestor deps
        working-directory: attestor
        run: npm ci
      - name: Run tests
        run: npm test

  python-sdk-tests:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: packages/python
        run: pip install -e '.[dev]'
      - name: Run tests
        working-directory: packages/python
        run: pytest tests/ -q

  cartesi-tests:
    name: Cartesi tests (chain clock / determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: cartesi
        run: npm ci
      - name: Typecheck
        working-directory: cartesi
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: cartesi
        run: npm test

  c-sdk-tests:
    name: C SDK tests (mbedtls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain + mbedtls
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libmbedtls-dev
      - name: Build + test
        working-directory: packages/c
        run: |
          cmake -B build -DLCORE_USE_CURL=OFF
          cmake --build build
          ./build/test_lcore
